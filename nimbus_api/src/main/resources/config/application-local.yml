spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nimbus}
    username: ${DATABASE_USERNAME:nimbus}
    password: ${DATABASE_PASSWORD:nimbus_password}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
