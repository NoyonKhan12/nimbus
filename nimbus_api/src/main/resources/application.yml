server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: nimbus
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jadd:
          create_namespaces: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  cache:
    type: redis

logging:
  level:
    com.nimbus: ${LOG_LEVEL_NIMBUS:INFO}
    root: ${LOG_LEVEL_ROOT:INFO}
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %X{traceId:-} %X{correlationId:-} %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram[all]: true

app:
  jwt:
    secret: ${JWT_SECRET:bmltYnVzLWRldi1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u}
    access-token-expiration-ms: 900000
    admin-access-token-expiration-ms: 86400000
    refresh-token-expiration-ms: 2592000000
  otp:
    expiration-minutes: 5
    code-length: 6
    max-attempts: 3
    rate-limit-per-15min: 5
  argon2:
    salt-length: 16
    hash-length: 32
    iterations: 4
    memory: 7680
    parallelism: 1
  booking:
    seat-hold-minutes: 5
    cutoff-minutes: 30
