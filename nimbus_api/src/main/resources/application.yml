server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: nimbus
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jadd:
          create_namespaces: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  cache:
    type: redis
  servlet:
    multipart:
      # Driver documents are validated again in DocumentStorageService.
      max-file-size: 10MB
      max-request-size: 12MB

logging:
  level:
    com.nimbus: ${LOG_LEVEL_NIMBUS:INFO}
    root: ${LOG_LEVEL_ROOT:INFO}
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %X{traceId:-} %X{correlationId:-} %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram[all]: true

app:
  upload:
    # Profile photos and driver documents live outside the packaged app.
    dir: ${APP_UPLOAD_DIR:./data/uploads}
    max-document-bytes: ${APP_UPLOAD_MAX_DOCUMENT_BYTES:10485760}
  jwt:
    # Required: never ship a fallback signing key. Compose/.env supplies it.
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    admin-access-token-expiration-ms: 86400000
    refresh-token-expiration-ms: 2592000000
  otp:
    expiration-minutes: 5
    code-length: 6
    max-attempts: 3
    rate-limit-per-15min: 5
  bootstrap:
    admin:
      # Opt-in only. Never enable with a shared/default password in prod.
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${ADMIN_EMAIL:admin@nimbus.com}
      password: ${ADMIN_PASSWORD:}
      phone: "${ADMIN_PHONE:+8801923456789}"
  argon2:
    salt-length: 16
    hash-length: 32
    iterations: 4
    memory: 7680
    parallelism: 1
  booking:
    seat-hold-minutes: 5
    cutoff-minutes: 30
