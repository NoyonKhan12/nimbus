# Nimbus API - Dev environment compose
# All services containerized on internal Docker network.

name: nimbus-api-dev

services:
  postgres:
    container_name: nimbus-postgres
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: nimbus-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: nimbus-api
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.dev
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nimbus
      - SPRING_DATASOURCE_USERNAME=nimbus
      - SPRING_DATASOURCE_PASSWORD=nimbus_password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8080:8080"

volumes:
  pgdata_dev:
  redisdata_dev:
