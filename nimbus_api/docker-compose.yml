# Nimbus API - Local development compose
# Runs the API against local PostgreSQL and Redis.
# API on port 9090 for development.

name: nimbus-api-local

services:
  postgres:
    container_name: nimbus-postgres
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: nimbus-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: nimbus-api
    build:
      context: .
      dockerfile: Dockerfile.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/nimbus
      - SPRING_DATASOURCE_USERNAME=nimbus
      - SPRING_DATASOURCE_PASSWORD=nimbus_password
      - SPRING_DATA_REDIS_HOST=host.docker.internal
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=local
    ports:
      - "9090:8080"
    volumes:
      - ./target:/app/target
      - ./src/main/resources:/app/src/main/resources

volumes:
  pgdata_local:
  redisdata_local:
