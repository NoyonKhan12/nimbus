name: nimbus_driver
description: Nimbus Driver app - Accept rides, manage earnings, and more
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^5.0.2
  web_socket_channel: ^2.4.0

  # JSON serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # Local storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Maps & Location
  geolocator: ^11.0.0

  # Notifications
  firebase_messaging: ^14.7.0
  firebase_core: ^2.24.0

  # Image picking
  image_picker: ^1.0.4

  # Utils
  intl: ^0.18.1
  uuid: ^4.2.2
  crypto: ^3.0.3
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  retrofit_generator: ^8.2.1
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
