# Local development compose
# Runs all services in Docker on your coding machine.
# API on port 9090 to avoid conflicts with other apps.
# DB on port 5432, Redis on port 6379, Admin on port 3001.
# Uses named volumes for persistence across restarts.
services:
  postgres:
    container_name: nimbus-postgres
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: nimbus-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: nimbus-api
    build:
      context: ./nimbus_api
      dockerfile: Dockerfile.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://nimbus-postgres:5432/nimbus
      - SPRING_DATASOURCE_USERNAME=nimbus
      - SPRING_DATASOURCE_PASSWORD=nimbus_password
      - REDIS_HOST=nimbus-redis
      - REDIS_PORT=6379
      - SPRING_REDIS_HOST=nimbus-redis
      - SPRING_REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=local
    ports:
      - "9090:8080"
    volumes:
      - ./nimbus_api/target:/app/target
      - ./nimbus_api/src/main/resources:/app/src/main/resources

  admin:
    container_name: nimbus-admin
    build:
      context: ./nimbus_admin
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://nimbus-api:8080/api/v1
    ports:
      - "3002:3002"
    volumes:
      - ./nimbus_admin/src:/app/src
      - ./nimbus_admin/public:/app/public

  # ── Flutter App Builders (for CI/CD APK generation) ──
  # These are one-shot build containers — excluded from default `docker compose up`
  # Run explicitly with: docker compose up app-builder

volumes:
  pgdata_local:
  redisdata_local:
